# Supply-chain hardening. These settings live in the repo (not only in a
# machine-wide config) so they also apply in CI and on every contributor's
# machine.

# Refuse package versions younger than 3 days: hijacked releases are usually
# caught and yanked within that window.
minimumReleaseAge: 4320

# Dependency install scripts run only when listed here with `true`.
allowBuilds:
  # Downloads Chrome for Testing for the E2E tests.
  puppeteer: true
  # Vue 2/3 switch script; Vue 3 needs nothing (same as the basicVue template).
  vue-demi: false

# Refuse a version published with weaker trust evidence than earlier versions of the same
# package (no provenance where there was some): the mark of a release from a stolen token.
trustPolicy: no-downgrade
