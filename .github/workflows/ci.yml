name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # The ruleset requires this check by name — rename both together.
    name: ci
    runs-on: ubuntu-latest
    # Hard ceiling: a hanging step would otherwise run until GitHub's 6-hour limit.
    timeout-minutes: 10
    steps:
      # Actions are pinned to commit SHAs: a moved tag cannot inject code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: gitleaks and the privacy check scan every commit —
          # in a public repo, a deleted secret is still in the history.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm compile
      - run: pnpm test
      - run: pnpm secrets:check
      - name: privacy check (tree + history)
        env:
          # Optional repository secret, one term per line (docs/public-repo-policy.md).
          # Not available to PRs from forks; the pattern rules still run there.
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
        run: pnpm privacy:check
      - name: gitleaks (full history)
        # The CLI (MIT) with a verified checksum instead of gitleaks-action,
        # which is under a proprietary license and wants to comment on PRs.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --verbose .
      - name: gitleaks self-test (OpenRouter rule)
        # The sample has no keyword like `key =`, so only our own rule can match it.
        run: |
          mkdir -p "$RUNNER_TEMP/selftest"
          printf 'sk-or-v1-%s\n' "$(printf 'ab12%.0s' $(seq 16))" > "$RUNNER_TEMP/selftest/sample.txt"
          if "$RUNNER_TEMP/gitleaks" dir --config .gitleaks.toml --no-banner --redact \
            --report-format json --report-path "$RUNNER_TEMP/selftest.json" \
            "$RUNNER_TEMP/selftest"; then
            echo "::error::gitleaks did not flag an OpenRouter key"
            exit 1
          fi
          jq -e 'any(.[]; .RuleID == "openrouter-api-key")' "$RUNNER_TEMP/selftest.json"
