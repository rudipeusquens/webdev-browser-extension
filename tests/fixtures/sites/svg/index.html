<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Icons fixture</title>
  </head>
  <body>
    <!-- Most pages draw their icons as inline SVG: none of these elements is an HTML element. -->
    <header>
      <a id="home" href="#top">
        <svg id="logo" width="32" height="32" viewBox="0 0 32 32" aria-label="Logo">
          <circle cx="16" cy="16" r="14" fill="#3355aa" />
        </svg>
        Example
      </a>
    </header>
    <main>
      <h1 id="title">Icons everywhere</h1>
      <p id="intro">Inline icons, a chart you can focus and a formula.</p>
      <svg id="chart" width="240" height="120" viewBox="0 0 240 120">
        <a id="chart-link" href="#chart" tabindex="0">
          <rect id="bar" x="20" y="10" width="60" height="100" fill="#aa5533" />
          <text x="24" y="116">Bar</text>
        </a>
      </svg>
      <p id="formula">
        <math><mi>x</mi><mo>=</mo><mn>2</mn></math>
      </p>
    </main>
  </body>
</html>
