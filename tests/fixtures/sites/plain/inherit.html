<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Inherited custom properties</title>
    <style>
      /* Page CSS relying on an inherited --tw-* variable, as Tailwind v3 sites can. */
      .parent {
        --tw-shadow: 0 0 0 5px rgb(255, 0, 0);
      }
      .child {
        width: 50px;
        height: 50px;
        box-shadow: var(--tw-shadow);
      }
    </style>
  </head>
  <body>
    <div class="parent"><div class="child" id="child"></div></div>
  </body>
</html>
